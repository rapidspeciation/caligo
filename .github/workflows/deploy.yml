name: Deploy to GitHub Pages

# Builds the Astro static site and deploys it to GitHub Pages.
# The site is served at the custom domain https://caligogenomics.com/
# (astro.config.mjs: base '/'); the domain is set in the repository's Pages
# settings and DNS lives in Cloudflare.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

# Least-privilege permissions required by the Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 and Astro 7 are tested here on the current Node LTS/current
          # line. Keep this in step with .nvmrc and package.json.
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Content integrity checks
        run: pnpm test

      - name: Type & content check
        run: pnpm check

      - name: Build
        run: pnpm build
        env:
          # Discord invite supplied by Nicol Rueda on 9 September 2026.
          PUBLIC_CALIGO_DISCORD_URL: https://discord.gg/gYjjx2FWW

      - name: Post-build navigation checks
        run: pnpm test:nav

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
